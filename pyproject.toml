[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "netmedic"
version = "0.1.0"
description = "AI agent that diagnoses network faults from a plain-English problem statement"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "mcp",
    "typer",
    "rich",
    "pyyaml",
    "netmiko",
    "python-dotenv",
]

[project.optional-dependencies]
netbox = ["pynetbox"]
web = ["fastapi", "uvicorn"]
dev = ["pytest", "ruff", "pynetbox", "fastapi", "uvicorn"]

[project.scripts]
netmedic = "netmedic.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"netmedic.web" = ["static/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
