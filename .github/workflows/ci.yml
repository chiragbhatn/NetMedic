name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests evals
      - name: Test (replay mode, no lab, no API key)
        env:
          COLUMNS: "250"
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee pytest-output.txt
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -n 9 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
